################################################################################
# Local development infrastructure for NovaPay.
#
# This compose file runs Postgres + MinIO so you can develop the Next.js apps
# directly on your host with `npm run dev`. Apps connect to:
#   - postgres at localhost:5432
#   - minio    at localhost:9000 (S3 API) / localhost:9001 (web console)
#
# Usage:
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   npm run dev:main                          # main NovaPay app on :3000
#   cd apps/registry && npm run dev:registry  # plugin registry on :3100
#
# Stop & wipe everything:
#   docker compose -f deploy/docker-compose.dev.yml down -v
################################################################################

name: novapay-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: novapay-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: novapay
      POSTGRES_PASSWORD: novapay
      # `novapay` is the main app database. The registry database is created
      # by the `postgres-init` service below.
      POSTGRES_DB: novapay
    ports:
      - "5432:5432"
    volumes:
      - novapay-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novapay -d novapay"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgres:16-alpine
    container_name: novapay-dev-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: novapay
    entrypoint:
      - sh
      - -c
      - |
        psql -h postgres -U novapay -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='novapay_registry'" \
          | grep -q 1 \
          || createdb -h postgres -U novapay novapay_registry
    restart: "no"

  minio:
    image: minio/minio
    container_name: novapay-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: novapay-minio-access
      MINIO_ROOT_PASSWORD: novapay-minio-secret
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console at http://localhost:9001
    volumes:
      - novapay-dev-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc
    container_name: novapay-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 novapay-minio-access novapay-minio-secret &&
        mc mb -p local/novapay-registry-packages || true
    restart: "no"

volumes:
  novapay-dev-postgres:
  novapay-dev-minio:
