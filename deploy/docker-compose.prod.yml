################################################################################
# NovaPay production deployment.
#
# Brings up Postgres + MinIO + main app + plugin registry + 3 background
# workers, all on a single host.
#
# Quick start:
#
#   cp .env.docker-compose.example .env
#   vim .env
#   docker compose -f deploy/docker-compose.prod.yml --profile ops run --rm migrate
#   docker compose -f deploy/docker-compose.prod.yml --profile ops run --rm migrate-registry
#   docker compose -f deploy/docker-compose.prod.yml --profile ops run --rm preflight
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# The `ops` profile contains one-shot tasks (database migration, preflight
# checks). They are excluded from `up -d` to keep the long-running stack lean.
################################################################################

name: novapay

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_USER:-novapay}
      POSTGRES_USER: ${POSTGRES_USER:-novapay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novapay}
    volumes:
      - novapay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-novapay} -d ${POSTGRES_USER:-novapay}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-novapay}
    entrypoint:
      - sh
      - -c
      - |
        psql -h postgres -U ${POSTGRES_USER:-novapay} -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='novapay_registry'" \
          | grep -q 1 \
          || createdb -h postgres -U ${POSTGRES_USER:-novapay} novapay_registry
    restart: "no"
    profiles: ["ops"]

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-novapay-minio-access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-novapay-minio-secret}
    volumes:
      - novapay-minio-data:/data
    # Expose only the console externally if needed; the S3 API stays on the
    # internal compose network. If you want public download URLs you should
    # put a reverse proxy (nginx/Caddy) in front of port 9000.
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-novapay-minio-access} ${MINIO_SECRET_KEY:-novapay-minio-secret} &&
        mc mb -p local/${S3_BUCKET:-novapay-registry-packages} || true
    restart: "no"

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    command: npm run db:migrate:deploy
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["ops"]

  migrate-registry:
    build:
      context: ../apps/registry
      dockerfile: Dockerfile
    env_file:
      - ../.env
    command: npm run prisma:migrate:deploy
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["ops"]

  preflight:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    command: npm run env:check:prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["ops"]

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-x-novapay-client-ip}
    command: npm run start
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Downloaded REMOTE_SIGNED plugin bundles live under runtime/plugins.
      # Persist + share them so a container rebuild does not wipe installed
      # plugins (PluginPackageInstall rows would otherwise point at missing
      # files, breaking channel template provisioning).
      - novapay-plugin-runtime:/app/runtime/plugins
      # Persist locally uploaded merchant QR images on the host so they do not
      # disappear after the web container is rebuilt or recreated.
      - ../runtime/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  registry:
    build:
      context: ../apps/registry
      dockerfile: Dockerfile
    env_file:
      - ../.env
    command: npm run start
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      # Registry admins can update plugin pricing after publication. Persist
      # those catalog-facing pricing fields back into the bundle metadata so
      # catalog prices survive registry container restarts.
      - ../artifacts:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/.well-known/trust.json').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  callbacks-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    command: npm run callbacks:worker
    volumes:
      - novapay-plugin-runtime:/app/runtime/plugins
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  finance-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    command: npm run finance:worker
    volumes:
      - novapay-plugin-runtime:/app/runtime/plugins
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  payment-monitor-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    command: npm run payment-monitor:worker
    volumes:
      - novapay-plugin-runtime:/app/runtime/plugins
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ctf-bill-capture-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    command: npm run ctf-bill-capture:worker
    volumes:
      - novapay-plugin-runtime:/app/runtime/plugins
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["ctf-lab"]

  onchain-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    command: npm run onchain:worker
    volumes:
      - novapay-plugin-runtime:/app/runtime/plugins
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  novapay-postgres-data:
  novapay-minio-data:
  novapay-plugin-runtime:
