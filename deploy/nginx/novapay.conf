geo $novapay_from_cloudflare {
  default 0;
  173.245.48.0/20 1;
  103.21.244.0/22 1;
  103.22.200.0/22 1;
  103.31.4.0/22 1;
  141.101.64.0/18 1;
  108.162.192.0/18 1;
  190.93.240.0/20 1;
  188.114.96.0/20 1;
  197.234.240.0/22 1;
  198.41.128.0/17 1;
  162.158.0.0/15 1;
  104.16.0.0/13 1;
  104.24.0.0/14 1;
  172.64.0.0/13 1;
  131.0.72.0/22 1;
  2400:cb00::/32 1;
  2606:4700::/32 1;
  2803:f800::/32 1;
  2405:b500::/32 1;
  2405:8100::/32 1;
  2a06:98c0::/29 1;
  2c0f:f248::/32 1;
}

map "$novapay_from_cloudflare:$http_cf_connecting_ip" $novapay_client_ip {
  ~^1:(.+)$ $1;
  default $remote_addr;
}

server {
  server_name pay.muyuai.top;

  location ^~ /api/ctf/bill-capture/ {
    if ($request_method != POST) {
      return 405;
    }

    client_max_body_size 16k;
    limit_req zone=ctf_capture_rate burst=5 nodelay;
    limit_req_status 429;
    limit_conn ctf_capture_conn 5;
    limit_conn_status 429;

    access_log /var/log/nginx/ctf-capture-access.log ctf_capture_redacted;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-NovaPay-Client-IP $novapay_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Real-IP "";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-NovaPay-Client-IP $novapay_client_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Real-IP "";
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/pay.muyuai.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pay.muyuai.top/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  if ($host = pay.muyuai.top) {
    return 301 https://$host$request_uri;
  }

  listen 80;
  server_name pay.muyuai.top;
  return 404;
}
