limit_req_zone $binary_remote_addr zone=ctf_capture_rate:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=ctf_capture_conn:10m;

log_format ctf_capture_redacted
  '$remote_addr - $remote_user [$time_local] '
  '"$request_method /api/ctf/bill-capture/[redacted] $server_protocol" '
  '$status $body_bytes_sent "$http_user_agent" '
  'request_id=$request_id request_time=$request_time';
